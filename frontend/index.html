<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WorkTrack | Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/style.css">

</head>

<body class="login-page">

  <div class="login-shell">

    <div class="login-brand">

      <div class="brand-mark">
        <i class="bi bi-buildings"></i>
      </div>

      <h1>
        Work<span>Track</span>
      </h1>

      <p>
        Work Tracking System for Small Manufacturing Units
      </p>

      <div class="login-feature">
        <i class="bi bi-check2-circle"></i>
        Manage employees & departments
      </div>

      <div class="login-feature">
        <i class="bi bi-check2-circle"></i>
        Track work & production
      </div>

      <div class="login-feature">
        <i class="bi bi-check2-circle"></i>
        Monitor attendance & progress
      </div>

    </div>


    <div class="login-card">

      <div class="mobile-brand">
        Work<span>Track</span>
      </div>

      <h1>
        Welcome back
      </h1>

      <form id="loginForm">

        <label class="form-label">
          Email / Username
        </label>

        <div class="input-icon">

          <i class="bi bi-person"></i>

          <input type="text" class="form-control" id="loginUser" required autocomplete="username">

        </div>


        <label class="form-label mt-3">
          Password
        </label>

        <div class="input-icon">

          <i class="bi bi-lock"></i>

          <input type="password" class="form-control" id="loginPass" required autocomplete="current-password">

        </div>


        <div class="d-flex justify-content-between align-items-center mt-3 mb-4">

          <label class="small">

            <input type="checkbox" class="form-check-input me-1">

            Remember me

          </label>


          <a href="#" class="small" id="forgotPasswordLink">
            Forgot password?
          </a>

        </div>


        <button class="btn btn-primary w-100 py-2" type="submit">

          <i class="bi bi-box-arrow-in-right me-2"></i>

          Sign In

        </button>

      </form>

    </div>

  </div>


  <!-- Forgot Password Modal -->

  <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title">

            <i class="bi bi-key me-2"></i>

            Reset Password

          </h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

        </div>


        <div class="modal-body">

          <form id="forgotPasswordForm">

            <div class="mb-3">

              <label class="form-label">
                Registered Email
              </label>

              <input type="email" class="form-control" id="forgotEmail" required>

            </div>


            <div class="mb-3">

              <label class="form-label">
                Registered Phone Number
              </label>

              <input type="text" class="form-control" id="forgotPhone" required>

            </div>


            <div class="mb-3">

              <label class="form-label">
                New Password
              </label>

              <input type="password" class="form-control" id="forgotNewPassword" minlength="6" required>

            </div>


            <div class="mb-3">

              <label class="form-label">
                Confirm New Password
              </label>

              <input type="password" class="form-control" id="forgotConfirmPassword" minlength="6" required>

            </div>


            <button type="submit" class="btn btn-primary w-100">

              <i class="bi bi-check-circle me-2"></i>

              Reset Password

            </button>

          </form>

        </div>

      </div>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="assets/script.js"></script>


  <script>

    document.addEventListener(
      'DOMContentLoaded',
      function () {

        const forgotLink =
          document.getElementById(
            'forgotPasswordLink'
          );

        const forgotForm =
          document.getElementById(
            'forgotPasswordForm'
          );

        const forgotModalElement =
          document.getElementById(
            'forgotPasswordModal'
          );

        if (
          !forgotLink ||
          !forgotForm ||
          !forgotModalElement
        ) {
          return;
        }


        const forgotModal =
          new bootstrap.Modal(
            forgotModalElement
          );


        forgotLink.addEventListener(
          'click',
          function (event) {

            event.preventDefault();

            forgotForm.reset();

            forgotModal.show();

          }
        );


        forgotForm.addEventListener(
          'submit',
          async function (event) {

            event.preventDefault();


            const email =
              document.getElementById(
                'forgotEmail'
              ).value.trim();


            const phone =
              document.getElementById(
                'forgotPhone'
              ).value.trim();


            const newPassword =
              document.getElementById(
                'forgotNewPassword'
              ).value;


            const confirmPassword =
              document.getElementById(
                'forgotConfirmPassword'
              ).value;


            if (newPassword.length < 6) {

              showToast(
                'New password must be at least 6 characters.'
              );

              return;

            }


            if (
              newPassword !==
              confirmPassword
            ) {

              showToast(
                'Passwords do not match.'
              );

              return;

            }


            try {

              const response =
                await fetch(
                  '/api/forgot-password',
                  {
                    method: 'POST',

                    headers: {
                      'Content-Type':
                        'application/json'
                    },

                    credentials:
                      'same-origin',

                    body: JSON.stringify({

                      email: email,

                      phone: phone,

                      new_password:
                        newPassword,

                      confirm_password:
                        confirmPassword

                    })
                  }
                );


              const data =
                await response.json();


              if (
                !response.ok ||
                !data.success
              ) {

                throw new Error(
                  data.message ||
                  'Password reset failed.'
                );

              }


              forgotModal.hide();

              forgotForm.reset();


              showToast(
                'Password reset successfully. You can now login.'
              );


            } catch (error) {

              showToast(
                error.message ||
                'Password reset failed.'
              );

            }

          }
        );

      }
    );

  </script>

</body>

</html>
