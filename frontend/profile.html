    <link rel="stylesheet" href="assets/style.css">

</head>

<body>

    <div class="app">

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-brand">

                    <i class="bi bi-buildings"></i>
                </div>

                <div>
                    <strong>WorkTrack</strong>
                    <small>Manufacturing OS</small>
                </div>

            </div>

            <div class="nav-label">
                MAIN
            </div>

            <nav>

                <a class="nav-link" href="dashboard.html">
                    <i class="bi bi-grid-1x2"></i>
                    Dashboard
                </a>

                <a class="nav-link" href="employees.html">
                    <i class="bi bi-people"></i>
                    Employees
                </a>

                <a class="nav-link" href="departments.html">
                    <i class="bi bi-diagram-3"></i>
                    Departments
                </a>

                <a class="nav-link" href="work.html">
                    <i class="bi bi-clipboard-check"></i>
                    Work Assignment
                </a>

                <a class="nav-link" href="progress.html">
                    <i class="bi bi-bar-chart-line"></i>
                    Work Progress
                </a>

                <a class="nav-link" href="attendance.html">
                    <i class="bi bi-calendar2-check"></i>
                    Attendance
                </a>

                <a class="nav-link" href="production.html">
                    <i class="bi bi-box-seam"></i>
                    Production
                </a>

                <a class="nav-link" href="reports.html">
                    <i class="bi bi-file-earmark-bar-graph"></i>
                    Reports
                </a>

            </nav>

            <div class="nav-label mt-3">
                ACCOUNT
            </div>

            <nav>

                <a class="nav-link active" href="profile.html">
                    <i class="bi bi-person-circle"></i>
                    My Profile
                </a>

                <a class="nav-link logout" href="index.html">
                    <i class="bi bi-box-arrow-left"></i>
                    Logout
                </a>

            </nav>

            <div class="sidebar-bottom">

                <div class="mini-avatar" id="sidebarAvatar">
                    --
                </div>

                <div>

                    <strong id="sidebarName">
                        Loading...
                    </strong>

                    <small id="sidebarRole">
                        --
                    </small>

                </div>

            </div>

        </aside>


        <main class="main">

            <header class="topbar">

                <button class="icon-btn d-lg-none" id="menuBtn">
                    <i class="bi bi-list"></i>
                </button>

                <div>

                    <h5 class="mb-0">
                        My Profile
                    </h5>


                </div>

                <div class="top-actions">

                    <button class="icon-btn" onclick="showToast('No new notifications')">
                        <i class="bi bi-bell"></i>
                        <span class="notification-dot"></span>
                    </button>

                    <div class="user-menu">

                        <div class="avatar" id="topAvatar">
                            --
                        </div>

                        <div class="d-none d-md-block">

                            <strong id="topName">
                                Loading...
                            </strong>

                            <small id="topRole">
                                --
                            </small>

                        </div>

                    </div>

                </div>

            </header>


            <section class="content">

                <div class="page-title">

                    <div>

                        <span class="eyebrow">

                        </span>


                    </div>

                </div>


                <div class="row g-3">

                    <div class="col-lg-4">

                        <div class="profile-card panel text-center">

                            <div class="profile-avatar" id="profileAvatar">
                                --
                            </div>

                            <h4 id="profileName">
                                Loading...
                            </h4>

                            <p class="muted" id="profileRole">
                                --
                            </p>

                            <span class="status green-status">
                                Active Account
                            </span>

                            <hr>

                            <div class="profile-info">

                                <div>

                                    <i class="bi bi-envelope"></i>

                                    <span id="profileEmail">
                                        --
                                    </span>

                                </div>

                                <div>

                                    <i class="bi bi-phone"></i>

                                    <span id="profilePhone">
                                        --
                                    </span>

                                </div>

                                <div>

                                    <i class="bi bi-building"></i>

                                    <span id="profileDepartment">
                                        --
                                    </span>

                                </div>

                            </div>

                        </div>

                    </div>


                    <div class="col-lg-8">

                        <div class="panel">

                            <div class="panel-head">

                                <div>

                                    <h5>
                                        Personal Information
                                    </h5>



                                </div>

                            </div>


                            <form id="profileForm">

                                <div class="row g-3">

                                    <div class="col-md-6">

                                        <label class="form-label">
                                            Full Name
                                        </label>

                                        <input type="text" class="form-control" id="fullName" required>

                                    </div>


                                    <div class="col-md-6">

                                        <label class="form-label">
                                            Email
                                        </label>

                                        <input type="email" class="form-control" id="email" required>

                                    </div>


                                    <div class="col-md-6">

                                        <label class="form-label">
                                            Phone
                                        </label>

                                        <input type="text" class="form-control" id="phone">

                                    </div>


                                    <div class="col-md-6">

                                        <label class="form-label">
                                            Role
                                        </label>

                                        <input type="text" class="form-control" id="role" disabled>

                                    </div>


                                    <div class="col-md-6">

                                        <label class="form-label">
                                            Username
                                        </label>

                                        <input type="text" class="form-control" id="username" disabled>

                                    </div>


                                    <div class="col-md-6">

                                        <label class="form-label">
                                            Department
                                        </label>

                                        <input type="text" class="form-control" id="department" disabled>

                                    </div>




                                    <div class="col-12 text-end">

                                        <button type="submit" class="btn btn-primary px-4" id="saveProfileBtn">
                                            Save Changes
                                        </button>

                                    </div>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <div id="toastBox" class="toast-container position-fixed bottom-0 end-0 p-3"></div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/script.js"></script>


    <script>

        let profileUser = null;


        function getInitials(name) {

            const parts = String(name || '')
                .trim()
                .split(/\s+/)
                .filter(Boolean);

            if (!parts.length) {
                return '--';
            }

            return parts
                .slice(0, 2)
                .map(part => part.charAt(0))
                .join('')
                .toUpperCase();

        }


        function setText(id, value) {

            const element = document.getElementById(id);

            if (element) {
                element.textContent = value || '--';
            }

        }


        async function loadProfile() {

            try {

                const result = await api('/profile');

                if (!result.success || !result.user) {

                    throw new Error(
                        result.message || 'Unable to load profile.'
                    );

                }

                profileUser = result.user;

                const initials =
                    getInitials(profileUser.full_name);

                setText(
                    'profileAvatar',
                    initials
                );

                setText(
                    'profileName',
                    profileUser.full_name
                );

                setText(
                    'profileRole',
                    profileUser.role
                );

                setText(
                    'profileEmail',
                    profileUser.email
                );

                setText(
                    'profilePhone',
                    profileUser.phone
                );

                setText(
                    'profileDepartment',
                    profileUser.department
                );

                setText(
                    'sidebarAvatar',
                    initials
                );

                setText(
                    'sidebarName',
                    profileUser.full_name
                );

                setText(
                    'sidebarRole',
                    profileUser.role
                );

                setText(
                    'topAvatar',
                    initials
                );

                setText(
                    'topName',
                    profileUser.full_name
                );

                setText(
                    'topRole',
                    profileUser.role
                );

                document.getElementById(
                    'fullName'
                ).value =
                    profileUser.full_name || '';

                document.getElementById(
                    'email'
                ).value =
                    profileUser.email || '';

                document.getElementById(
                    'phone'
                ).value =
                    profileUser.phone || '';

                document.getElementById(
                    'role'
                ).value =
                    profileUser.role || '';

                document.getElementById(
                    'username'
                ).value =
                    profileUser.username || '';

                document.getElementById(
                    'department'
                ).value =
                    profileUser.department || '';


            } catch (error) {

                showToast(
                    error.message || 'Failed to load profile.'
                );

            }

        }


        document
            .getElementById('profileForm')
            .addEventListener(
                'submit',
                async function (event) {

                    event.preventDefault();

                    const button =
                        document.getElementById(
                            'saveProfileBtn'
                        );

                    const data = {

                        full_name:
                            document.getElementById(
                                'fullName'
                            ).value.trim(),

                        email:
                            document.getElementById(
                                'email'
                            ).value.trim(),

                        phone:
                            document.getElementById(
                                'phone'
                            ).value.trim(),

                    };


                    if (!data.full_name) {

                        showToast(
                            'Full name is required.'
                        );

                        return;

                    }


                    if (!data.email) {

                        showToast(
                            'Email is required.'
                        );

                        return;

                    }


                    try {

                        button.disabled = true;

                        button.textContent = 'Saving...';

                        const result = await api(
                            '/profile',
                            {
                                method: 'PUT',
                                body: JSON.stringify(data)
                            }
                        );

                        if (!result.success) {

                            throw new Error(
                                result.message ||
                                'Profile update failed.'
                            );

                        }

                        showToast(
                            result.message ||
                            'Profile updated successfully.'
                        );

                        await loadProfile();

                    } catch (error) {

                        showToast(
                            error.message ||
                            'Failed to update profile.'
                        );

                    } finally {

                        button.disabled = false;

                        button.textContent =
                            'Save Changes';

                    }

                }
            );


        document.addEventListener(
            'DOMContentLoaded',
            loadProfile
        );

    </script>

</body>

</html>
